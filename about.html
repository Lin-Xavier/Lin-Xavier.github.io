<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById("theme-toggle");
  var order = ["auto", "light", "dark"];
  var labels = { auto: "Color theme: automatic", light: "Color theme: light", dark: "Color theme: dark" };
  var mode = "auto";
  try { mode = localStorage.getItem("theme") || "auto"; } catch (e) {}
  function apply() {
    if (mode === "auto") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", mode);
    btn.setAttribute("aria-label", labels[mode]);
    btn.title = labels[mode];
    btn.dataset.mode = mode;
  }
  btn.addEventListener("click", function () {
    mode = order[(order.indexOf(mode) + 1) % order.length];
    try { localStorage.setItem("theme", mode); } catch (e) {}
    apply();
  });
  apply();
})();
</script>
<script>
// The CV download is guarded by Cloudflare Turnstile; the Worker checks the token and sends the PDF.
var cvWidget;
function cvTheme() {
  var t = document.documentElement.getAttribute("data-theme");
  return t === "light" || t === "dark" ? t : "auto";
}
function onTurnstileLoad() {
  var button = document.getElementById("cv-download");
  cvWidget = turnstile.render("#cv-check", {
    sitekey: "0x4AAAAAAFWOli0DaNBlAOn7",
    theme: cvTheme(),
    callback: function () { button.disabled = false; },
    "expired-callback": function () { button.disabled = true; },
    "error-callback": function () { button.disabled = true; }
  });
  // Each token works once, so get a fresh check after a download starts.
  document.getElementById("cv-form").addEventListener("submit", function () {
    button.disabled = true;
    setTimeout(function () { turnstile.reset(cvWidget); }, 1500);
  });
}
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
